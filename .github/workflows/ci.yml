on:
  pull_request:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: 21
        distribution: zulu
    - uses: sbt/setup-sbt@v1
    - run: sbt
           -v
           --server
           -J-Xmx4G
           -J-Xms4G
           "Jmh/run -i 10 -wi 10 -f1 -t1"
